[workspace]
resolver = "2"
members = [

    "generator",
    "server",
    "core",
]

[profile.release]
debug = true

[profile.smol]
inherits = "release"
strip = true

[workspace.dependencies]

[workspace.lints.rust]
# Keep the workspace's own crates warning-free: any warning fails the build.
warnings = "deny"
