[package]
name = "acrostic-generator"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html



[dependencies]
serde = { version = "1.0.217", features = ["derive"] }
memmap = "0.7.0"
brotli = "3.5.0"
ordered-float = { version = "3.9.2", features = ["serde"] }
rand = "0.8.5"
tikv-jemallocator = "0.5"
partition = "0.1.2"
itertools = "0.15.0"
arrayvec = "0.7.6"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "fs", "io-util","signal"] }
serde_json = "1.0.135"
unicode-segmentation = "1.12.0"
csv = "1.3.1"
futures = "0.3.31"
rand_xorshift = "0.3.0"
acrostic-core = { path = "../core" }
any_ascii = "0.1.7"
encoding_rs = "0.8.44"
anyhow = "1.0.95"
bincode = "1.3.3"
safe-once-async = { path = "../../safe-once-async",features = ["tokio-rt"] }
parking_lot = "0.12.3"
tempfile = "3.15.0"
smallvec = "1.13.2"
safe-once-map = { path = "../../safe-once-map" }
safe-once = { path = "../../safe-once" }
num_cpus = "1.16"
pin-project = "1"
rkyv = { version = "0.7.45", features = ["validation"] }
ollama-rs = "0.3.6"
schemars = "1.2.1"
oxttl = "0.1.5"
oxrdf = "0.2.4"
unicode-script = "0.5.9"

[features]
# Prints diagnostics from the answer search: each slow pair search that finds no swap, and each
# seed that fails, with how many pair searches the search has run.
search-diagnostics = []

[lints]
workspace = true
